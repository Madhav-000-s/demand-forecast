name: deploy

# Builds an image that bakes in one registered model and releases it as a canary:
#   1. pin 100% of traffic to the current stable revision
#   2. create the new revision (0% traffic) and label it `canary`
#   3. smoke-test the canary label URL (contract + canary_reference checks)
#   4. shift 10% of traffic to it and run canary analysis for 10 minutes
#      (App Insights: 5xx rate and p95 of the canary revision only)
#   5. promote to 100%, or roll back to the stable revision and fail
#
# Before the Container App exists (first rollout) it stops after pushing the
# image and prints the APP_IMAGE value for Terraform.
#
# Drills (drill.yml passes `drill`): the image is built with an injected fault
# (bad-model: wrong forecasts with HTTP 200; slow-release: +400 ms per request).
# A drill release is never promoted: it is always rolled back, and the job
# fails only if the fault got past both the smoke test and the canary analysis.

on:
  push:
    branches: [main]
    paths:
      - app/**
      - ml/features.py
      - ml/canary.py
      - Dockerfile
      - requirements/app.txt
      - scripts/smoke_test.py
      - scripts/canary_analysis.py
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      model_version:
        description: Azure ML registry version of dfcast-lgbm (blank = latest)
        type: string
        default: ""
  workflow_call:
    inputs:
      model_version:
        type: string
        default: ""
      drill:
        description: none | bad-model | slow-release
        type: string
        default: none

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  MODEL_NAME: dfcast-lgbm
  IMAGE_NAME: dfcast-api
  TERRAFORM_VERSION: "1.16.4"
  CANARY_PERCENT: "10"
  CANARY_MINUTES: "10"

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      DRILL: ${{ inputs.drill || 'none' }}
    steps:
      - name: Validate drill input
        run: |
          case "$DRILL" in none|bad-model|slow-release) ;; *) echo "::error::unknown drill $DRILL"; exit 1 ;; esac
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install (smoke test + canary analysis)
        run: pip install -r requirements/train.txt

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Read infrastructure outputs
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}" >/dev/null
          out() { terraform output -raw "$1" 2>/dev/null || true; }
          {
            echo "RG=$(out resource_group)"
            echo "ACR_NAME=$(out acr_name)"
            echo "ACR_SERVER=$(out acr_login_server)"
            echo "AML_WS=$(out aml_workspace)"
            echo "APPI_ID=$(out app_insights_id)"
            echo "APPI_APP_ID=$(out app_insights_app_id)"
            echo "APP=$(out container_app_name)"
            echo "ENV_DOMAIN=$(out environment_default_domain)"
            echo "KV_NAME=$(out key_vault_name)"
          } >> "$GITHUB_ENV"

      - name: Azure CLI setup
        run: |
          az extension add -n ml -y --upgrade   # containerapp and rest are core commands
          az configure --defaults group="$RG" workspace="$AML_WS"

      - name: Ops token (lets synthetic traffic past the API rate limit)
        run: |
          tok=""
          if [ -n "${KV_NAME:-}" ]; then
            tok=$(az keyvault secret show --vault-name "$KV_NAME" -n ops-bypass-token --query value -o tsv 2>/dev/null || true)
          fi
          if [ -n "$tok" ]; then
            echo "::add-mask::$tok"
            echo "OPS_BYPASS_TOKEN=$tok" >> "$GITHUB_ENV"
          else
            echo "::warning::no ops token in Key Vault yet; synthetic traffic is subject to the rate limit"
          fi

      - name: Download model from the Azure ML registry
        env:
          REQUESTED_VERSION: ${{ inputs.model_version }}
        run: |
          v="$REQUESTED_VERSION"
          if ! [[ "$v" =~ ^[0-9]*$ ]]; then echo "::error::model_version must be a number"; exit 1; fi
          if [ -z "$v" ]; then v=$(az ml model list -n "$MODEL_NAME" --query "[0].version" -o tsv); fi
          if [ -z "$v" ]; then echo "::error::no registered $MODEL_NAME model; run the train workflow first"; exit 1; fi
          az ml model download -n "$MODEL_NAME" -v "$v" --download-path dl
          src=$(dirname "$(find dl -name model.txt | head -1)")
          mkdir -p artifacts && cp "$src"/* artifacts/
          {
            echo "AML_MODEL_VERSION=$v"
            echo "MODEL_LABEL=$(jq -r .model_version artifacts/metadata.json)"
            # revision suffix: lowercase letters, digits, hyphens; starts with a letter
            if [ "$DRILL" = none ]; then
              echo "SUFFIX=g${GITHUB_SHA::7}-m${v}-r${GITHUB_RUN_NUMBER}"
            else
              echo "SUFFIX=drill-${DRILL}-m${v}-r${GITHUB_RUN_NUMBER}"
            fi
          } >> "$GITHUB_ENV"

      - name: Inject the drill fault into this build's artifacts
        if: env.DRILL != 'none'
        run: |
          note=$(python scripts/drill.py prepare "$DRILL" --artifacts artifacts)
          echo "DRILL_NOTE=$note" >> "$GITHUB_ENV"
          echo "**Drill \`$DRILL\`:** $note" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push image
        run: |
          IMAGE="$ACR_SERVER/$IMAGE_NAME:${GITHUB_SHA::7}-m$AML_MODEL_VERSION"
          if [ "$DRILL" != none ]; then IMAGE="$IMAGE-drill-$DRILL"; fi
          az acr login -n "$ACR_NAME"
          docker build -t "$IMAGE" .
          if [ -f artifacts/fault.json ]; then
            # drill image = production image + the fault file (the Dockerfile never copies it)
            printf 'FROM %s\nCOPY fault.json /app/artifacts/fault.json\n' "$IMAGE" \
              | docker build -t "$IMAGE" -f - artifacts
          fi
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Built \`$IMAGE\` with model **$MODEL_LABEL** (registry version $AML_MODEL_VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: First rollout (no Container App yet)
        if: env.APP == '' && env.DRILL == 'none'
        run: |
          {
            echo "The Container App does not exist yet. Set the image for its first revision and apply Terraform:"
            echo '```'
            echo "gh variable set APP_IMAGE --body \"$IMAGE\""
            echo "gh workflow run infra.yml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pin traffic to the stable revision
        id: stable
        if: env.APP != ''
        run: |
          stable=$(az containerapp revision list -n "$APP" -g "$RG" \
            --query "sort_by([?properties.active && properties.trafficWeight > \`0\`], &properties.trafficWeight)[-1].name" -o tsv)
          echo "name=$stable" >> "$GITHUB_OUTPUT"
          echo "STABLE=$stable" >> "$GITHUB_ENV"
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$stable=100" -o none
          echo "Stable revision: \`$stable\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create canary revision (0% traffic)
        id: canary
        if: env.APP != ''
        run: |
          echo "CANARY_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" --revision-suffix "$SUFFIX" -o none
          new="$APP--$SUFFIX"
          echo "name=$new" >> "$GITHUB_OUTPUT"
          echo "CANARY=$new" >> "$GITHUB_ENV"
          az containerapp revision label add -n "$APP" -g "$RG" --revision "$new" --label canary --yes -o none
          echo "Canary revision: \`$new\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the canary (label URL, no user traffic)
        id: smoke
        if: env.APP != ''
        continue-on-error: ${{ (inputs.drill || 'none') != 'none' }} # a drill judges the outcome below
        run: |
          python scripts/smoke_test.py \
            --base-url "https://$APP---canary.$ENV_DOMAIN" \
            --reference artifacts/canary_reference.json \
            --expected-version "$MODEL_LABEL" --ready-timeout 240

      - name: Annotate deployment in App Insights
        if: env.APP != ''
        continue-on-error: true
        run: |
          props=$(jq -cn --arg rev "$CANARY" --arg model "$MODEL_LABEL" --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{revision:$rev, model:$model, commit:$sha, run:$run}')
          label="canary"; if [ "$DRILL" != none ]; then label="drill $DRILL"; fi
          # One annotation object with an Id (an array, or no Id, gets "Value cannot be null")
          body=$(jq -cn --arg id "$(cat /proc/sys/kernel/random/uuid)" --arg name "$label $CANARY" \
            --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg p "$props" \
            '{Id:$id, AnnotationName:$name, EventTime:$t, Category:"Deployment", Properties:$p}')
          az rest --method put --url "https://management.azure.com${APPI_ID}/Annotations?api-version=2015-05-01" \
            --headers Content-Type=application/json --body "$body" -o none

      - name: Shift ${{ env.CANARY_PERCENT }}% of traffic to the canary
        if: env.APP != '' && steps.smoke.outcome == 'success'
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" \
            --revision-weight "$STABLE=$((100 - CANARY_PERCENT))" "$CANARY=$CANARY_PERCENT" -o none

      - name: Canary analysis (${{ env.CANARY_MINUTES }} minutes)
        id: analysis
        if: env.APP != '' && steps.smoke.outcome == 'success'
        continue-on-error: ${{ (inputs.drill || 'none') != 'none' }}
        run: |
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          python scripts/canary_analysis.py --app-url "https://$fqdn" --revision "$CANARY" \
            --appinsights-app-id "$APPI_APP_ID" --minutes "$CANARY_MINUTES"

      - name: Promote canary to 100%
        if: env.APP != '' && steps.analysis.outcome == 'success' && env.DRILL == 'none'
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$CANARY=100" -o none
          az containerapp revision label remove -n "$APP" -g "$RG" --label canary -o none || true
          if [ "$STABLE" != "$CANARY" ]; then
            az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$STABLE" -o none
          fi
          echo "**Promoted** \`$CANARY\` to 100%; \`$STABLE\` deactivated (reactivate it to roll back)." >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back
        if: (failure() || env.DRILL != 'none') && steps.canary.outcome == 'success'
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$STABLE=100" -o none
          az containerapp revision label remove -n "$APP" -g "$RG" --label canary -o none || true
          az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$CANARY" -o none || true
          echo "ROLLED_BACK=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "**Rolled back**: 100% on \`$STABLE\`, \`$CANARY\` deactivated." >> "$GITHUB_STEP_SUMMARY"
          body=$(jq -cn --arg id "$(cat /proc/sys/kernel/random/uuid)" --arg name "rollback $CANARY" \
            --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{Id:$id, AnnotationName:$name, EventTime:$t, Category:"Deployment", Properties:"{}"}')
          az rest --method put --url "https://management.azure.com${APPI_ID}/Annotations?api-version=2015-05-01" \
            --headers Content-Type=application/json --body "$body" -o none || true

      - name: Restore traffic if the canary was never created
        if: failure() && steps.stable.outcome == 'success' && steps.canary.outcome != 'success'
        run: az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$STABLE=100" -o none

      - name: Drill verdict
        if: always() && env.DRILL != 'none' && steps.canary.outcome == 'success'
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          ANALYSIS: ${{ steps.analysis.outcome }}
          CANARY_REQUESTS: ${{ steps.analysis.outputs.requests || '0' }}
          CANARY_P95: ${{ steps.analysis.outputs.p95_ms || '' }}
          CANARY_VERDICT: ${{ steps.analysis.outputs.verdict || '' }}
        run: |
          conn=$(az resource show --ids "$APPI_ID" --query properties.ConnectionString -o tsv)
          echo "::add-mask::$conn"
          export APPLICATIONINSIGHTS_CONNECTION_STRING="$conn"
          if [ "$SMOKE" = failure ]; then
            passed=true; caught="smoke test"; users=0
            outcome="smoke test rejected the canary before it received traffic; rolled back"
          elif [ "$ANALYSIS" = failure ]; then
            passed=true; caught="canary analysis"; users="$CANARY_REQUESTS"
            outcome="canary analysis rolled back after $CANARY_REQUESTS canary requests ($CANARY_VERDICT)"
          else
            passed=false; caught="nothing"; users="$CANARY_REQUESTS"
            outcome="fault NOT detected (smoke $SMOKE, analysis $ANALYSIS); rolled back by the drill"
          fi
          case "$DRILL" in
            bad-model) expected="smoke test rejects wrong forecasts before any traffic shift" ;;
            slow-release) expected="canary analysis sees p95 above 300 ms and rolls back" ;;
          esac
          python scripts/drill.py record --name "$DRILL" --start "$CANARY_START" --end "${ROLLED_BACK:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" \
            --expected "$expected" --outcome "$outcome" --passed "$passed" \
            --extra "caught_by=$caught" --extra "revision=$CANARY" --extra "stable=$STABLE" \
            --extra "canary_requests=$users" --extra "canary_p95_ms=$CANARY_P95" --extra "fault=$DRILL_NOTE"
