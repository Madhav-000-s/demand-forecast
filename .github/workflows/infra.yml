name: infra

# Applies Terraform for prod when infra/ changes on main (or on demand).
# Images and traffic are managed by deploy.yml, not here.

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.4"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_app_image: ${{ vars.APP_IMAGE }}
      TF_VAR_min_replicas: ${{ vars.MIN_REPLICAS || '0' }}
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Outputs
        run: |
          {
            echo '### Terraform outputs'
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
